<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>托福单词练习台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182026;
      --muted: #607080;
      --line: #d7dee5;
      --panel: #ffffff;
      --soft: #f3f6f8;
      --brand: #0f7b6c;
      --brand-dark: #095f53;
      --accent: #e4572e;
      --good: #148c5a;
      --bad: #c43830;
      --shadow: 0 18px 48px rgba(20, 34, 45, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 0 0, rgba(15, 123, 108, 0.18), transparent 32rem),
        linear-gradient(135deg, #fbf7ef 0%, #edf5f2 48%, #f7f8fb 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 56px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .title-block p {
      max-width: 680px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, minmax(78px, 1fr));
      gap: 8px;
      min-width: 292px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .score {
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .score span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .score strong {
      display: block;
      margin-top: 3px;
      font-size: 24px;
      line-height: 1;
    }

    .toolbar {
      display: grid;
      grid-template-columns: auto minmax(160px, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.84);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .tab {
      min-height: 38px;
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
      border-radius: 6px;
      white-space: nowrap;
    }

    .tab.active {
      color: #fff;
      background: var(--brand);
      box-shadow: 0 8px 18px rgba(15, 123, 108, 0.22);
    }

    .select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .select-wrap label {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    select {
      width: min(280px, 100%);
      min-height: 40px;
      padding: 0 12px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .tools {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-button,
    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border-radius: 8px;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .icon-button {
      width: 42px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .primary-button {
      padding: 0 16px;
      color: #fff;
      background: var(--brand);
      gap: 8px;
    }

    .icon-button:hover,
    .primary-button:hover {
      transform: translateY(-1px);
    }

    .primary-button:hover {
      background: var(--brand-dark);
    }

    .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 16px;
      color: var(--bad);
      background: #fff0ed;
      border: 1px solid #f3c5bd;
      border-radius: 8px;
      gap: 8px;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .secondary-button:hover {
      transform: translateY(-1px);
      background: #ffe4df;
    }

    .workspace {
      min-height: 560px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .mode {
      display: none;
      min-height: 560px;
    }

    .mode.active {
      display: block;
    }

    .match-board {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(42px, 8vw, 112px);
      min-height: 560px;
      padding: 28px;
    }

    #lineCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .column {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .word-card {
      min-height: 62px;
      padding: 12px 15px;
      text-align: left;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(24, 32, 38, 0.06);
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .word-card b {
      display: block;
      font-size: 18px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .word-card span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .word-card:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 123, 108, 0.44);
      box-shadow: 0 12px 26px rgba(24, 32, 38, 0.09);
    }

    .word-card.selected {
      border-color: var(--brand);
      background: #e8f6f2;
      box-shadow: 0 0 0 3px rgba(15, 123, 108, 0.16);
    }

    .word-card.correct {
      color: #fff;
      background: var(--good);
      border-color: var(--good);
      pointer-events: none;
    }

    .word-card.correct span {
      color: rgba(255, 255, 255, 0.76);
    }

    .word-card.removing {
      transform: scale(0.96);
      opacity: 0;
    }

    .word-card.wrong {
      animation: shake 0.28s ease;
      border-color: var(--bad);
    }

    @keyframes shake {
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    .write-mode {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
      gap: clamp(20px, 5vw, 56px);
      align-items: start;
      min-height: 560px;
      padding: clamp(22px, 4vw, 42px) clamp(20px, 5vw, 58px);
    }

    .prompt-panel {
      display: grid;
      gap: 12px;
      padding: 0;
      color: var(--ink);
    }

    .prompt-panel small {
      display: none;
      color: var(--muted);
      font-size: 14px;
    }

    .prompt-word {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.24;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .prompt-panel p {
      display: none;
    }

    .answer-panel {
      display: grid;
      align-content: start;
      gap: 16px;
      padding: 0;
    }

    .answer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
    }

    .answer-input {
      min-height: 54px;
      width: 100%;
      padding: 0 16px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 20px;
      outline: none;
    }

    .answer-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 123, 108, 0.14);
    }

    .feedback {
      min-height: 52px;
      padding: 13px 14px;
      color: var(--muted);
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.45;
    }

    .feedback.good {
      color: #0f5c3c;
      background: #e9f7ef;
      border-color: #bce4ce;
    }

    .feedback.bad {
      color: #8a241d;
      background: #fff0ed;
      border-color: #f3c5bd;
    }

    .progress {
      height: 10px;
      overflow: hidden;
      background: var(--soft);
      border-radius: 999px;
    }

    .progress i {
      display: block;
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .word-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 6px;
    }

    .mini-word {
      padding: 9px 10px;
      color: var(--muted);
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-word.done {
      color: #0f5c3c;
      background: #e9f7ef;
      border-color: #bce4ce;
    }

    .mini-word.skipped {
      color: #8a241d;
      background: #fff0ed;
      border-color: #f3c5bd;
    }

    .mini-word.current {
      color: var(--ink);
      background: #fff8e8;
      border-color: #f0d38a;
    }

    svg.icon {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex: 0 0 auto;
    }

    @media (max-width: 820px) {
      .app {
        width: min(100% - 20px, 680px);
        padding: 16px 0;
      }

      .topbar,
      .toolbar,
      .write-mode {
        grid-template-columns: 1fr;
      }

      .scoreboard {
        min-width: 0;
      }

      .select-wrap,
      .tools {
        justify-content: stretch;
      }

      .tools > * {
        flex: 1;
      }

      .tabs {
        width: 100%;
      }

      .tab {
        flex: 1;
      }

      .match-board {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 16px;
      }

      #lineCanvas {
        display: none;
      }

      .word-card {
        min-height: 56px;
      }

      .answer-row {
        grid-template-columns: 1fr;
      }

      .word-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>托福单词练习台</h1>
        <p>选一个单词范围，先做中英连线：中文和英文配对正确后会自动消掉。再切到看中文写英文，答错会保留当前题，答对后会先显示正确答案，再进入下一题。</p>
      </div>
      <section class="scoreboard" aria-label="练习统计">
        <div class="score"><span>正确</span><strong id="rightCount">0</strong></div>
        <div class="score"><span>错误</span><strong id="wrongCount">0</strong></div>
        <div class="score"><span>进度</span><strong id="doneCount">0/50</strong></div>
      </section>
    </header>

    <nav class="toolbar" aria-label="练习工具">
      <div class="tabs" role="tablist">
        <button class="tab active" id="matchTab" type="button" role="tab" aria-selected="true">中英连线</button>
        <button class="tab" id="writeTab" type="button" role="tab" aria-selected="false">看中文写英文</button>
      </div>
      <div class="select-wrap">
        <label for="rangeSelect">范围</label>
        <select id="rangeSelect" aria-label="选择单词范围"></select>
      </div>
      <div class="tools">
        <button class="icon-button" id="shuffleButton" type="button" title="打乱本轮">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="primary-button" id="resetButton" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
          重开
        </button>
      </div>
    </nav>

    <section class="workspace">
      <section class="mode active" id="matchMode" aria-label="中英连线练习">
        <div class="match-board" id="matchBoard">
          <canvas id="lineCanvas"></canvas>
          <div class="column" id="chineseColumn"></div>
          <div class="column" id="englishColumn"></div>
        </div>
      </section>

      <section class="mode" id="writeMode" aria-label="看中文写英文练习">
        <div class="write-mode">
          <aside class="prompt-panel">
            <small id="writeStep">第 1 题</small>
            <h2 class="prompt-word" id="promptWord">坚持</h2>
            <p id="hintText">词性和例句会在这里出现。</p>
          </aside>
          <div class="answer-panel">
            <div class="progress" aria-label="默写进度"><i id="writeProgress"></i></div>
            <div class="answer-row">
              <input class="answer-input" id="answerInput" type="text" autocomplete="off" spellcheck="false" placeholder="输入英文">
              <button class="primary-button" id="checkButton" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m20 6-11 11-5-5"/></svg>
                检查
              </button>
              <button class="secondary-button" id="skipButton" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14 0"/><path d="m13 6 6 6-6 6"/></svg>
                跳过
              </button>
            </div>
            <div class="feedback" id="feedback">准备好了就开始。</div>
            <div class="word-list" id="writeList" aria-label="本轮单词"></div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const documentWords = [
    {
            "cn": "v. 加速；促进；加快",
            "en": "accelerate",
            "pos": "v.",
            "example": "The wide use of digital technology has accelerated the pace of social development in modern cities."
    },
    {
            "cn": "v. 提倡，拥护，主张 n. 倡导者",
            "en": "advocate",
            "pos": "v.",
            "example": "Many sociologists advocate that citizens should reduce the use of disposable plastic products to protect the environment."
    },
    {
            "cn": "v. 减轻，缓解（痛苦、压力、问题）",
            "en": "alleviate",
            "pos": "v.",
            "example": "Building more public hospitals can effectively alleviate the pressure of medical resources shortage in urban areas."
    },
    {
            "cn": "adj. 模糊的，含糊不清的，有歧义的",
            "en": "ambiguous",
            "pos": "adj.",
            "example": "Ambiguous social norms may lead to misunderstandings between people from different cultural backgrounds."
    },
    {
            "cn": "v. 放大，增强；扩大（影响）",
            "en": "amplify",

    },
    {

            "pos": "v.",
            "example": "Immigrants need time to assimilate into the local society and adapt to the new living environment."

    {
            "cn": "v. 把…归因于；认为是…所为 n. 特征，属性",
            "en": "attribute",

    },
    {
            "cn": "v. 禁止，取缔 n. 禁令",
            "en": "ban",
            "pos": "v.",
            "example": "Some countries have decided to ban the sale of tobacco products to teenagers under the age of 18."
    },
    {
            "cn": "v. 繁荣，兴旺，迅速发展 n. 繁荣期，热潮",
            "en": "boom",
            "pos": "v.",
            "example": "The tourism industry has boomed in coastal cities since the relaxation of travel restrictions."
    },
    {
            "cn": "n. 边界，界限；分界线",
            "en": "boundary",

    {

    {

    {

            "en": "conventional",

    },
    {

            "example": "Strict supervision and punishment mechanisms can prevent officials from becoming corrupt and protect social fairness."
    },
    {
            "cn": "v. 控制，抑制，约束 n. 约束，限制",

            "example": "Air quality in some industrial cities will continue to deteriorate if no effective environmental protection measures are taken."

    {
            "cn": "adj. 毁灭性的，极具破坏力的；令人震惊的",

    {
            "cn": "adj. 激烈的， 猛烈的；极端的，急剧的",

    const $ = (selector) => document.querySelector(selector);
    const elements = {
      rangeSelect: $("#rangeSelect"),
      matchTab: $("#matchTab"),
      writeTab: $("#writeTab"),
      matchMode: $("#matchMode"),
      writeMode: $("#writeMode"),
      chineseColumn: $("#chineseColumn"),
      englishColumn: $("#englishColumn"),
      matchBoard: $("#matchBoard"),
      canvas: $("#lineCanvas"),
      rightCount: $("#rightCount"),
      wrongCount: $("#wrongCount"),
      doneCount: $("#doneCount"),
      resetButton: $("#resetButton"),
      shuffleButton: $("#shuffleButton"),
      writeStep: $("#writeStep"),
      promptWord: $("#promptWord"),
      hintText: $("#hintText"),
      answerInput: $("#answerInput"),
      checkButton: $("#checkButton"),
      skipButton: $("#skipButton"),
      feedback: $("#feedback"),
      writeProgress: $("#writeProgress"),
      writeList: $("#writeList")
    };

    let currentRangeKey = "";
    let activeMode = "match";
    let leftSelection = null;
    let rightSelection = null;
    let matchedIds = new Set();
    let matches = [];
    let currentRoundWords = [];
    let writeIndex = 0;
    let writeDone = new Set();
    let writeSkipped = new Set();
    let stats = { right: 0, wrong: 0 };

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalize(value) {
      return value.trim().toLowerCase().replace(/\s+/g, " ");
    }

    function meaningText(word) {
      return word.cn.replace(/^(v\.\/n\.|v\.|n\.|adj\.|adv\.)\s*/, "");
    }

    function rangesForWords(wordsList) {
      const chunkSize = 50;
      const ranges = [];
      for (let start = 0; start < wordsList.length; start += chunkSize) {
        const end = Math.min(start + chunkSize, wordsList.length);
        ranges.push({ key: `${start}-${end - 1}`, label: `${start + 1}-${end}`, start, end });
      }
      return ranges;
    }

    function selectedRange() {
      const ranges = rangesForWords(documentWords);
      return ranges.find((range) => range.key === currentRangeKey) || ranges[0];
    }

    function baseWords() {
      const range = selectedRange();
      return documentWords
        .slice(range.start, range.end)
        .map((word, index) => {
          const originalIndex = range.start + index;
          return { ...word, id: `word-${originalIndex}` };
        });
    }

    function buildRoundWords() {
      currentRoundWords = shuffle(baseWords());
    }

    function words() {
      if (!currentRoundWords.length) buildRoundWords();
      return currentRoundWords;
    }

    function processedWriteCount() {
      return new Set([...writeDone, ...writeSkipped]).size;
    }

    function isWriteProcessed(index) {
      return writeDone.has(index) || writeSkipped.has(index);
    }

    function advanceWriteIndex() {
      const currentWords = words();
      if (processedWriteCount() >= currentWords.length) return;
      do {
        writeIndex = (writeIndex + 1) % currentWords.length;
      } while (isWriteProcessed(writeIndex));
    }

    function updateStats() {
      const total = words().length;
      const done = activeMode === "match" ? matchedIds.size : processedWriteCount();
      elements.rightCount.textContent = stats.right;
      elements.wrongCount.textContent = stats.wrong;
      elements.doneCount.textContent = `${done}/${total}`;
      elements.writeProgress.style.width = `${Math.round((processedWriteCount() / total) * 100)}%`;
    }

    function clearSelections() {
      leftSelection = null;
      rightSelection = null;
      document.querySelectorAll(".word-card.selected").forEach((button) => button.classList.remove("selected"));
    }

    function makeCard(word, side) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "word-card";
      button.dataset.id = word.id;
      button.dataset.side = side;
      button.innerHTML = side === "cn"
        ? `<b>${meaningText(word)}</b><span>${word.pos}</span>`
        : `<b>${word.en}</b>`;
      button.addEventListener("click", () => selectMatch(button));
      return button;
    }

    function renderMatch() {
      clearSelections();
      matchedIds = new Set();
      matches = [];
      elements.chineseColumn.innerHTML = "";
      elements.englishColumn.innerHTML = "";

      const currentWords = words();
      currentWords.forEach((word) => elements.chineseColumn.appendChild(makeCard(word, "cn")));
      shuffle(currentWords).forEach((word) => elements.englishColumn.appendChild(makeCard(word, "en")));
      updateStats();
      requestAnimationFrame(drawLines);
    }

    function selectMatch(button) {
      const id = button.dataset.id;
      if (matchedIds.has(id)) return;

      if (button.dataset.side === "cn") {
        if (leftSelection) leftSelection.classList.remove("selected");
        leftSelection = button;
      } else {
        if (rightSelection) rightSelection.classList.remove("selected");
        rightSelection = button;
      }
      button.classList.add("selected");

      if (!leftSelection || !rightSelection) return;
      if (leftSelection.dataset.id === rightSelection.dataset.id) {
        const matchedId = leftSelection.dataset.id;
        const matchedLeft = leftSelection;
        const matchedRight = rightSelection;
        matchedIds.add(matchedId);
        matchedLeft.classList.add("correct");
        matchedRight.classList.add("correct");
        stats.right += 1;
        clearSelections();
        setTimeout(() => {
          matchedLeft.classList.add("removing");
          matchedRight.classList.add("removing");
        }, 140);
        setTimeout(() => {
          matchedLeft.remove();
          matchedRight.remove();
          drawLines();
        }, 330);
      } else {
        stats.wrong += 1;
        leftSelection.classList.add("wrong");
        rightSelection.classList.add("wrong");
        setTimeout(() => {
          document.querySelectorAll(".word-card.wrong").forEach((card) => card.classList.remove("wrong"));
          clearSelections();
        }, 320);
      }
      updateStats();
    }

    function drawLines() {
      const canvas = elements.canvas;
      const rect = elements.matchBoard.getBoundingClientRect();
      const ctx = canvas.getContext("2d");
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * scale));
      canvas.height = Math.max(1, Math.floor(rect.height * scale));
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(20, 140, 90, 0.72)";

      matches.forEach(({ left, right }) => {
        const a = left.getBoundingClientRect();
        const b = right.getBoundingClientRect();
        const startX = a.right - rect.left;
        const startY = a.top + a.height / 2 - rect.top;
        const endX = b.left - rect.left;
        const endY = b.top + b.height / 2 - rect.top;
        const mid = Math.max(24, (endX - startX) / 2);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(startX + mid, startY, endX - mid, endY, endX, endY);
        ctx.stroke();
      });
    }

    function renderWriteList() {
      elements.writeList.innerHTML = "";
      words().forEach((word, index) => {
        const item = document.createElement("div");
        item.className = "mini-word";
        if (writeDone.has(index)) item.classList.add("done");
        if (writeSkipped.has(index)) item.classList.add("skipped");
        if (index === writeIndex && !isWriteProcessed(index)) item.classList.add("current");
        item.textContent = `${index + 1}. ${meaningText(word)}`;
        elements.writeList.appendChild(item);
      });
    }

    function renderWriteQuestion() {
      const currentWords = words();
      if (processedWriteCount() === currentWords.length) {
        elements.writeStep.textContent = "已完成";
        elements.promptWord.textContent = "全部答完";
        elements.hintText.textContent = "可以重开或换一组词继续练。";
        elements.answerInput.value = "";
        elements.answerInput.disabled = true;
        elements.checkButton.disabled = true;
        elements.skipButton.disabled = true;
        elements.feedback.className = "feedback good";
        elements.feedback.textContent = "这一轮完成了。";
        updateStats();
        renderWriteList();
        return;
      }

      while (isWriteProcessed(writeIndex)) {
        advanceWriteIndex();
      }
      const word = currentWords[writeIndex];
      elements.writeStep.textContent = `第 ${writeIndex + 1} 题 / ${currentWords.length}`;
      elements.promptWord.textContent = `${writeIndex + 1}. ${word.pos} ${meaningText(word)}`;
      elements.hintText.textContent = `词性：${word.pos}`;
      elements.answerInput.disabled = false;
      elements.checkButton.disabled = false;
      elements.skipButton.disabled = false;
      elements.answerInput.value = "";
      elements.feedback.className = "feedback";
      elements.feedback.textContent = "输入对应英文后检查。";
      updateStats();
      renderWriteList();
      setTimeout(() => elements.answerInput.focus(), 0);
    }

    function checkAnswer() {
      const currentWords = words();
      const word = currentWords[writeIndex];
      const answer = normalize(elements.answerInput.value);
      if (!answer) {
        elements.feedback.className = "feedback bad";
        elements.feedback.textContent = "先写一个答案。";
        return;
      }

      if (answer === normalize(word.en)) {
        stats.right += 1;
        writeDone.add(writeIndex);
        elements.feedback.className = "feedback good";
        elements.feedback.textContent = `正确：${meaningText(word)} = ${word.en}`;
        advanceWriteIndex();
        setTimeout(renderWriteQuestion, 2000);
      } else {
        stats.wrong += 1;
        elements.feedback.className = "feedback bad";
        elements.feedback.textContent = `再想想。注意词性：${word.pos}`;
      }
      updateStats();
    }

    function skipAnswer() {
      const currentWords = words();
      const word = currentWords[writeIndex];
      writeSkipped.add(writeIndex);
      stats.wrong += 1;
      elements.feedback.className = "feedback bad";
      elements.feedback.textContent = `已跳过：${meaningText(word)}`;
      advanceWriteIndex();
      renderWriteQuestion();
    }

    function switchMode(mode) {
      activeMode = mode;
      const isMatch = mode === "match";
      elements.matchTab.classList.toggle("active", isMatch);
      elements.writeTab.classList.toggle("active", !isMatch);
      elements.matchTab.setAttribute("aria-selected", String(isMatch));
      elements.writeTab.setAttribute("aria-selected", String(!isMatch));
      elements.matchMode.classList.toggle("active", isMatch);
      elements.writeMode.classList.toggle("active", !isMatch);
      updateStats();
      if (isMatch) {
        requestAnimationFrame(drawLines);
      } else {
        renderWriteQuestion();
      }
    }

    function resetAll({ keepStats = false } = {}) {
      if (!keepStats) stats = { right: 0, wrong: 0 };
      buildRoundWords();
      matchedIds = new Set();
      matches = [];
      writeIndex = 0;
      writeDone = new Set();
      writeSkipped = new Set();
      renderMatch();
      renderWriteQuestion();
      switchMode(activeMode);
    }


    function populateRanges() {
      const ranges = rangesForWords(documentWords);
      elements.rangeSelect.innerHTML = "";
      ranges.forEach((range) => {
        const option = document.createElement("option");
        option.value = range.key;
        option.textContent = range.label;
        elements.rangeSelect.appendChild(option);
      });
      currentRangeKey = ranges.some((range) => range.key === currentRangeKey) ? currentRangeKey : ranges[0].key;
      elements.rangeSelect.value = currentRangeKey;
    }

    elements.matchTab.addEventListener("click", () => switchMode("match"));
    elements.writeTab.addEventListener("click", () => switchMode("write"));
    elements.resetButton.addEventListener("click", () => resetAll());
    elements.shuffleButton.addEventListener("click", () => resetAll());
    elements.rangeSelect.addEventListener("change", (event) => {
      currentRangeKey = event.target.value;
      resetAll();
    });
    elements.checkButton.addEventListener("click", checkAnswer);
    elements.skipButton.addEventListener("click", skipAnswer);
    elements.answerInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") checkAnswer();
    });
    window.addEventListener("resize", () => requestAnimationFrame(drawLines));

    populateRanges();
    resetAll();
  </script>
</body>
</html>
